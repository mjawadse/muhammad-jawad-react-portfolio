<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#2758ff" />
    <title>Message received | Muhammad Jawad</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #2758ff; color: #171817; }
      main { width: min(680px, 100%); padding: clamp(36px, 7vw, 72px); border: 2px solid #171817; border-radius: 28px; background: #f2f0e9; box-shadow: 12px 12px 0 #171817; }
      p:first-child { margin: 0 0 22px; font-size: .8rem; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; color: #2758ff; }
      h1 { margin: 0; max-width: 10ch; font-size: clamp(2.5rem, 8vw, 5.6rem); line-height: .92; letter-spacing: -.07em; }
      p { max-width: 46ch; font-size: 1.06rem; line-height: 1.65; }
      a { display: inline-flex; margin-top: 14px; padding: 14px 20px; border: 2px solid #171817; border-radius: 999px; background: #171817; color: #f2f0e9; font-weight: 800; text-decoration: none; }
      a:hover { background: #2758ff; }
    </style>
  </head>
  <body>
    <main>
      <p>Form submitted</p>
      <h1>Message received.</h1>
      <p>Thank you for getting in touch. I will review your message and reply as soon as possible.</p>
      <a href="/">Back to portfolio</a>
    </main>
  </body>
</html>
